# Builds Halcyn for Linux, Windows and Android. Pushing a tag like v0.2.0 publishes the
# builds as a GitHub release, which is where the app's updater looks for new versions.
# Running it by hand (Actions → Release → Run workflow) only builds, to check.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libpipewire-0.3-dev libasound2-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version
        run: echo "VERSION_ARGS=$(.github/version-args.sh)" >> "$GITHUB_ENV"
      - run: flutter build linux --release $VERSION_ARGS
      - name: Package
        run: |
          cp -r build/linux/x64/release/bundle halcyn
          tar -czf halcyn-linux-x64.tar.gz halcyn
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: halcyn-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version
        shell: bash
        run: echo "VERSION_ARGS=$(.github/version-args.sh)" >> "$GITHUB_ENV"
      - shell: bash
        run: flutter build windows --release $VERSION_ARGS
      - name: Package
        shell: pwsh
        run: |
          Copy-Item -Recurse build\windows\x64\runner\Release Halcyn
          Compress-Archive -Path Halcyn -DestinationPath halcyn-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: halcyn-windows-x64.zip

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Without the secrets (forks), the build is signed with a throwaway debug key.
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/halcyn.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=halcyn\n' \
              "$RUNNER_TEMP/halcyn.jks" "$PASSWORD" "$PASSWORD" > android/key.properties
          fi
      - name: Version
        run: echo "VERSION_ARGS=$(.github/version-args.sh)" >> "$GITHUB_ENV"
      - run: flutter build apk --release --split-per-abi $VERSION_ARGS
      - name: Package
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "halcyn-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: halcyn-android-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            halcyn-linux-x64.tar.gz
            halcyn-windows-x64.zip
            halcyn-android-*.apk
