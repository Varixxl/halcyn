<!-- The app icon: the mark on a graphite tile. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E222A"/>
      <stop offset="1" stop-color="#0D0F12"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#tile)"/>
  <rect x="33" y="33" width="958" height="958" rx="219" fill="none" stroke="#2C313C" stroke-width="2"/>
  <image href="mark.svg" x="0" y="-20" width="1024" height="1024"/>
</svg>
