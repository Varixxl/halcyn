[package]
name = "halcyn_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
audioadapter-buffers = "5.2.0"
dirs = "7.0.0"
flutter_rust_bridge = "=2.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jwalk = "0.9.0"
lofty = "0.25.5"
rayon = "1.12.0"
realfft = "3.5.0"
rtrb = "0.4.1"
rubato = "5.0.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "aac", "alac", "vorbis", "pcm", "wav", "aiff", "ogg", "isomp4", "mkv", "caf"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v0_3_65"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1.1"
